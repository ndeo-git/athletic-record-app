  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);

  header .sub { font-size:13px; color:var(--muted); margin-top:4px; }

  nav button { background:none; border:none; padding:0 0 4px; cursor:pointer;
    font-family:"Courier New", monospace; letter-spacing:.08em; font-size:12px;
    color:var(--muted); border-bottom:2px solid transparent; }
  nav button.on { color:var(--ink); border-bottom-color:var(--red); }
  .card { background:var(--card); border:1px solid var(--rule); padding:14px; margin-bottom:14px; }
  label.f { display:block; font-family:"Courier New", monospace; letter-spacing:.08em;
    font-size:10px; color:var(--muted); margin:10px 0 3px; }
  input, select, textarea { width:100%; padding:9px 10px; font-size:15px; border:1px solid var(--rule);
    border-radius:2px; background:#fff; color:var(--ink); font-family:inherit; }
  textarea { min-height:130px; line-height:1.55; }
  button.b { padding:11px 16px; font-size:14px; border:none; border-radius:2px;
    color:#fff; background:var(--green); cursor:pointer; }
  button.b.ink { background:var(--ink); } button.b.red { background:var(--red); }
  button.b.mut { background:var(--muted); } button.b:disabled { background:var(--muted); opacity:.7; }
  button.b.ghost { background:#fff; color:var(--red); border:1px solid var(--red); }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .err { color:var(--red); font-size:14px; margin:8px 0; }
  .ok { background:var(--tint); border:1px solid var(--green); padding:10px; font-size:14px; margin:8px 0; }
  .warnbox { background:var(--warn); border:1px solid var(--red); padding:10px; font-size:13px; margin:8px 0; }

/* ----------------------------------------------- unseal (WebCrypto) */
const te = new TextEncoder(), td = new TextDecoder();
const fromB64 = (b) => Uint8Array.from(atob(b), c => c.charCodeAt(0));
async function deriveKey(pass, salt) {
  const km = await crypto.subtle.importKey("raw", te.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 310000, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
async function unsealCoach(sealed, passcode) {
  const key = await deriveKey(passcode, fromB64(sealed.salt));
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(sealed.iv) }, key, fromB64(sealed.blob));
  const payload = JSON.parse(td.decode(pt));
  return { id: sealed.id, ...payload, name: payload.name || sealed.name || "Coach" };
}

function notifyAdmin(action, payload) {
  const hook = state.coach && state.coach.adminWebhook;
  if (!hook) return;
  try {
    fetch(hook, {
      method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ at: new Date().toISOString(), coach: state.coach ? state.coach.name : "", action, ...payload }),
    });
  } catch (e) { /* fire and forget */ }
}

/* ------------------------------------------------------- Claude API */
async function callClaude(prompt) {
  const key = (state.coach && state.coach.apiKey) || settings.apiKey;
  if (!key) throw new Error("No API key available — ask your admin, or paste one in Settings.");
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({ model: "claude-sonnet-4-5", max_tokens: 1000,
      messages: [{ role: "user", content: prompt }] }),
  });
  const out = await res.json();
  if (out && out.error) throw new Error(out.error.message || "API error");
  return (out.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
}
function parseFields(raw, keys) {
  const text = (raw || "").replace(/```/g, "").trim();
  const pos = keys.map(k => ({ k, i: text.indexOf("===" + k + "===") }))
    .filter(p => p.i >= 0).sort((a, b) => a.i - b.i);
  if (!pos.length) return null;
  const f = {};
  pos.forEach((p, idx) => {
    const s = p.i + p.k.length + 6;
    const e = idx + 1 < pos.length ? pos[idx + 1].i : text.length;
    f[p.k] = text.slice(s, e).trim();
  });
  return f;
}

function PdfDoc() {

    rect(x, y, w, h, mode, fill, stroke, lw) {

      if (stroke) p.push(col(stroke) + " RG " + (lw || 1).toFixed(2) + " w");
      p.push(x.toFixed(2) + " " + (PH - y - h).toFixed(2) + " " + w.toFixed(2) + " " + h.toFixed(2) + " re");
      p.push(mode === "FD" ? "B" : mode === "S" ? "S" : "f");

    line(x1, y1, x2, y2, stroke, lw) {

    text(str, x, y, f, size, color, align) {

    build() {
      const objs = []; const fk = Object.keys(FONTS);
      const fontBase = 3 + pages.length * 2;
      const fontRes = fk.map((k, i) => "/" + k + " " + (fontBase + i) + " 0 R").join(" ");
      const kids = pages.map((_, i) => (3 + i * 2) + " 0 R").join(" ");
      objs.push("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj");
      objs.push("2 0 obj\n<< /Type /Pages /Kids [" + kids + "] /Count " + pages.length + " >>\nendobj");
      pages.forEach((p, i) => {
        const stream = p.join("\n");
        objs.push((3 + i * 2) + " 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + PW + " " + PH + "] /Resources << /Font << " + fontRes + " >> >> /Contents " + (4 + i * 2) + " 0 R >>\nendobj");
        objs.push((4 + i * 2) + " 0 obj\n<< /Length " + stream.length + " >>\nstream\n" + stream + "\nendstream\nendobj");

      fk.forEach((k, i) => objs.push((fontBase + i) + " 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /" + FONTS[k] + " >>\nendobj"));

function downloadPdfBytes(pdf, filename) {

  doc.line(MG, 51, PW - MG, 51, C.ink, 0.7);

  doc.line(MG, PH - 45, PW - MG, PH - 45, C.rule, 0.7);

function makeLessonPdf({ student, coach, date, lessonType, reportMd, entryNo, duration }) {
  const doc = PdfDoc();
  drawChrome(doc, "PROGRESS REPORT", [
    "ENTRY No. " + entryNo + " - RECORDED " + date.toUpperCase() + " - PART OF " + student.name.toUpperCase() + "'S PERMANENT DEVELOPMENT RECORD",
    "QUESTIONS? REPLY TO THIS REPORT OR TALK TO YOUR COACH AT THE NEXT LESSON",
  ]);
  let y = 100;
  doc.text(student.name + "'s " + student.sport.toLowerCase() + " lesson", MG, y, "TIMESB", 24, C.ink);
  y += 16;
  doc.text(date + "   -   " + (duration ? duration + " MIN " : "") + lessonType.toUpperCase() + "   -   WITH " + coachLabel(coach).toUpperCase(), MG, y, "COUR", 9, C.muted);
  y += 22;
  const sections = parseSections(reportMd);
  const width = PW - 2 * MG;
  const isMoment = l => /moment/i.test(l);
  const isHwNext = l => /^homework/i.test(l);
  const isHwLast = l => /last.*homework|homework.*last/i.test(l);
  const plain = sections.filter(s => !isMoment(s.label) && !isHwNext(s.label) && !isHwLast(s.label));
  const moment = sections.find(s => isMoment(s.label));
  const hwNext = sections.find(s => isHwNext(s.label) && !isHwLast(s.label));
  const hwLast = sections.find(s => isHwLast(s.label));
  plain.forEach(s => {
    if (s.label) { doc.text(s.label.toUpperCase(), MG, y, "COURB", 8.5, C.green); y += 13; }
    const lines = wrapText(s.body, "HELV", 10.5, width);
    doc.lines(lines, MG, y, "HELV", 10.5, C.ink, 14.5);
    y += lines.length * 14.5 + 12;
  });
  if (moment && moment.body) {
    const inner = width - 28;
    const lines = wrapText('"' + moment.body + '"', "TIMESI", 12.5, inner);
    const h = 26 + lines.length * 16 + 12;
    doc.rect(MG, y, width, h, "FD", C.card, C.rule, 0.9);
    doc.rect(MG, y, 3, h, "F", C.red);
    doc.text((moment.label || "Notable moment").toUpperCase(), MG + 14, y + 16, "COURB", 8.5, C.red);
    doc.lines(lines, MG + 14, y + 32, "TIMESI", 12.5, C.ink, 16);
    y += h + 16;
  }
  if (hwNext && !hwLast) {
    // Group/clinic reports have no per-kid homework ledger history - draw
    // a single full-width homework box instead of the two-column ledger.
    const lines = wrapText(hwNext.body, "HELV", 10, width - 28);
    const h = 30 + lines.length * 14 + 14;
    doc.rect(MG, y, width, h, "FD", C.tint, C.green, 0.9);
    doc.text("HOMEWORK BEFORE OUR NEXT LESSON", MG + 14, y + 18, "COURB", 8.5, C.green);
    doc.lines(lines, MG + 14, y + 34, "HELV", 10, C.ink, 14);
    y += h + 20;
  } else if (hwNext || hwLast) {
    const colW = width / 2 - 28;
    const leftLines = hwNext ? wrapText(hwNext.body, "HELV", 10, colW) : [];
    let stamp = "", note = "";
    if (hwLast) {
      const m2 = hwLast.body.match(/^(Done|Partially done|Not done|Not discussed)[\s\u2014:,.-]*/i);
      stamp = m2 ? m2[1] : "";
      note = m2 ? hwLast.body.slice(m2[0].length).trim() : hwLast.body;
    }
    const rightLines = note ? wrapText(note, "HELV", 9.5, colW) : [];
    const h = Math.max(30 + leftLines.length * 14, 30 + (stamp ? 16 : 0) + rightLines.length * 13) + 14;
    doc.rect(MG, y, width, h, "FD", C.tint, C.green, 0.9);
    doc.line(MG + width / 2, y, MG + width / 2, y + h, C.rule, 0.7);
    doc.text("HOMEWORK BEFORE OUR NEXT LESSON", MG + 14, y + 18, "COURB", 8.5, C.green);
    doc.text("LAST HOMEWORK", MG + width / 2 + 14, y + 18, "COURB", 8.5, C.green);
    if (leftLines.length) doc.lines(leftLines, MG + 14, y + 34, "HELV", 10, C.ink, 14);
    let ry = y + 34;
    if (stamp) {
      const done = /^done/i.test(stamp);
      doc.text(stamp.toUpperCase(), MG + width / 2 + 14, ry, "COURB", 11, done ? C.green : C.muted);
      ry += 16;

    if (rightLines.length) doc.lines(rightLines, MG + width / 2 + 14, ry, "HELV", 9.5, C.muted, 13);
    y += h + 20;

function groupNotesPrompt({ students, coach, date, transcript }) {

ATTENDEES (the only children who were there):
${students.map(st => `- id: ${st.id} / first name: ${st.name}`).join("\n")}
Instructor: ${coachLabel(coach)}. Date: ${date}. Duration: ${state.duration} minutes.
Write COMMON, HOMEWORK and the per-child notes in the same language as the transcript.

TASK - sort the transcript into:

2. HOMEWORK: homework given to the group, one sentence, or leave blank.
3. For EACH attendee: ONLY what the coach said about THAT specific child, faithfully. Do not paraphrase praise into existence. If a child was not mentioned at all, write exactly: NOT MENTIONED
4. NOTES: flag anything odd - a name in the transcript that is not on the attendee list, something you could not confidently attribute to one child, safety concerns; or the single word None.

CRITICAL RULES:
- The transcript comes from speech-to-text, which often mangles names - especially uncommon ones. The attendee list above is the complete set of children present, so when the transcript contains a name (or name-like fragment) that is not on the list but sounds like an attendee, attribute it to that attendee - e.g. "Rajasi", "Rajas V" or "Roger V" are almost certainly Rajasvi; "Mia" is likely Mira. Record every such mapping in NOTES as: heard "X", treated as <name>.
- If a mangled name could plausibly be MORE than one attendee (e.g. it sounds like both Emma and Mira), do NOT guess - put that piece of the transcript in NOTES and let the coach place it.
- A name that cannot plausibly be any attendee (a different instructor, a parent, a child clearly not present) stays out of every child's section - record it in NOTES.
- Never place one child's information in another child's section. If attribution is unclear for any other reason, put it in NOTES instead - the coach will sort it out.
- Use ONLY the transcript. Never invent.

Respond in EXACTLY this format, using every attendee id, in this order, nothing else:
===COMMON===
...
===HOMEWORK===
...
${students.map(st => `===STUDENT:${st.id}===\n...`).join("\n")}
===NOTES===
...

TRANSCRIPT:
${transcript}`;
}

/* ----------------------------------------------------- interactions */
function toast(msg) {
  const d = document.createElement("div");
  d.textContent = msg;
  d.style.cssText = "position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#22331F;color:#fff;padding:10px 14px;border-radius:4px;font-size:13px;z-index:99;max-width:92%;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.3)";
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 4500);
}

// Bottom sheet shown when mailto: goes nowhere (iOS home-screen standalone
// mode swallows mailto silently; some Android setups too). Offers the
// native share sheet, which works everywhere and reaches Mail/Gmail/etc.
function emailFallbackSheet(to, subject, body) {
  const old = document.getElementById("mailFallback");
  if (old) old.remove();
  const wrap = document.createElement("div");
  wrap.id = "mailFallback";
  wrap.style.cssText = "position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:3px solid #B23A2A;padding:14px 16px 18px;z-index:100;box-shadow:0 -2px 14px rgba(0,0,0,.25);font-size:14px;color:#22331F";
  const msg = document.createElement("div");
  msg.style.cssText = "margin-bottom:10px;line-height:1.5";
  msg.textContent = "Your mail app didn't open (common when running from the home-screen icon). The full email is already copied - paste it anywhere - or share it directly:";
  wrap.appendChild(msg);
  const addr = document.createElement("div");
  addr.style.cssText = "font-size:12px;color:#6B7263;margin-bottom:10px;word-break:break-all";
  addr.textContent = "Send to: " + to;
  wrap.appendChild(addr);
  const row = document.createElement("div");
  row.style.cssText = "display:flex;gap:8px;flex-wrap:wrap";
  const mkBtn = (label, bg, fn) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.style.cssText = "padding:11px 16px;font-size:14px;border:none;border-radius:2px;color:#fff;background:" + bg + ";cursor:pointer";
    b.onclick = fn;
    return b;
  };
  if (navigator.share) {
    row.appendChild(mkBtn("Share report…", "#2F6B4F", () => {
      navigator.share({ title: subject, text: "To: " + to + "\n\n" + body }).catch(() => {});
      wrap.remove();
    }));
  }
  row.appendChild(mkBtn("Copy again", "#22331F", () => {
    try { navigator.clipboard.writeText("To: " + to + "\nSubject: " + subject + "\n\n" + body); } catch (e) {}
    toast("Copied.");
  }));
  row.appendChild(mkBtn("Close", "#6B7263", () => wrap.remove()));
  wrap.appendChild(row);
  document.body.appendChild(wrap);
}

function emailEntry(entry, student) {
  const to = (student.parentEmails || []).join(",");
  const plain = entry.report.replace(/\*\*/g, "");
  const subject = student.name + "'s " + student.sport + " lesson - " + entry.date + " (" + coachLabel() + ")";
  const body = plain + "\n\n- " + coachLabel() + "\n" + ORG_NAME;
  // Clipboard safety net first, while we still have the user gesture.
  try { navigator.clipboard.writeText("To: " + to + "\nSubject: " + subject + "\n\n" + body); } catch (e) {}
  // If the mail app opens, this page loses focus/visibility; if neither
  // happens within ~1.3s, the mailto was swallowed - show the fallback.
  let opened = false;
  const markOpened = () => { opened = true; };
  document.addEventListener("visibilitychange", markOpened, { once: true });
  window.addEventListener("pagehide", markOpened, { once: true });
  window.addEventListener("blur", markOpened, { once: true });
  const a = document.createElement("a");
  a.href = "mailto:" + to + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => {
    document.removeEventListener("visibilitychange", markOpened);
    window.removeEventListener("pagehide", markOpened);
    window.removeEventListener("blur", markOpened);
    if (opened) toast("Email drafted - the report is also on your clipboard.");
    else emailFallbackSheet(to, subject, body);
  }, 1300);
  notifyAdmin("email_opened", { student: student.name, date: entry.date });
}

// One-tap server-side send: builds the PDF here, posts it to the admin's
// Apps Script webhook, which emails the parents with the PDF attached
// (from the admin's Google account) and logs the send to the sheet.
function sendReportToParents({ student, date, lessonType, report, entryNo, duration }) {
  const hook = state.coach && state.coach.adminWebhook;
  if (!hook) { toast("Direct sending isn't set up yet - ask your admin, or use the mail-app button."); return; }
  const to = (student.parentEmails || []).join(",");
  if (!to) { toast("No parent email on file for " + student.name + " - tell your admin."); return; }
  let built;
  try {
    built = makeLessonPdf({ student, coach: state.coach, date, lessonType, reportMd: report, entryNo, duration: duration || state.duration });
  } catch (e) { toast("Couldn't build the PDF - use Download PDF / mail app instead."); return; }
  const plain = report.replace(/\*\*/g, "");
  const payload = {
    action: "send_report",
    at: new Date().toISOString(),
    coach: state.coach.name,
    student: student.name,
    date: date,
    to: to,
    subject: student.name + "'s " + student.sport + " lesson - " + date + " (Coach " + state.coach.name + ")",
    body: plain + "\n\n- Coach " + state.coach.name + "\n" + ORG_NAME,
    filename: built.filename,
    pdfBase64: btoa(built.pdf),
  };
  try {
    fetch(hook, { method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain" }, body: JSON.stringify(payload) });
    toast("Sent to " + to + " with the PDF attached. Delivery is logged for your admin.");
  } catch (e) { toast("Send failed (network) - use the mail-app button instead."); }
}



function bind() {
  if (!state.coach) {
    const tryLogin = async () => {
      const pass = $("loginPin").value;
      if (!pass) { $("loginErr").textContent = "Enter your passcode."; return; }
      $("loginBtn").disabled = true; $("loginBtn").textContent = "Unlocking...";
      $("loginErr").textContent = "";
      // Try the passcode against every sealed scorebook; only the matching
      // one decrypts. Coaches never see who else is in the file.
      for (const sealed of SEALED_COACHES) {
        try {
          state.coach = await unsealCoach(sealed, pass);
          state.speechLang = state.coach.speechLang || "en-US";
          state.reportLang = state.coach.reportLang || "English";
          notifyAdmin("login", {});
          render();
          return;
        } catch (e) { /* not this one */ }
      }
      $("loginBtn").disabled = false; $("loginBtn").textContent = "Open my scorebook";
      $("loginErr").textContent = "That passcode doesn't open any scorebook here.";
    };
    $("loginBtn").onclick = tryLogin;
    $("loginPin").onkeydown = (ev) => { if (ev.key === "Enter") tryLogin(); };
    return;
  }
  $("logout").onclick = (ev) => { ev.preventDefault(); state.coach = null; state.draft = null; state.finalText = ""; render(); };
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { state.tab = b.dataset.tab; state.openEntryId = ""; render(); });

  if (state.tab === "lesson") bindLesson();
  if (state.tab === "record") bindRecord();
  if (state.tab === "settings") bindSettings();
}

function bindLesson() {
  $("lessonType").onchange = () => {
    state.lessonType = $("lessonType").value;
    state.draft = null; state.gdraft = null; state.cdraft = null;
    render();
  };
  $("date").onchange = () => { state.date = $("date").value; };
  $("duration").oninput = () => { state.duration = $("duration").value; };
  $("speechLang").onchange = () => { state.speechLang = $("speechLang").value; };
  $("reportLang").onchange = () => { state.reportLang = $("reportLang").value; render(); };
  $("transcript").oninput = () => { state.finalText = $("transcript").value; };
  const applyDurDefault = () => {
    const k = durKey();
    if (!k) return;
    const saved = durPrefs.get(k);
    if (saved) { state.duration = saved; $("duration").value = saved; }
  };

  const studentSel = $("student");
  if (studentSel) studentSel.onchange = () => {
    const st = state.coach.students.find(x => x.id === studentSel.value);
    $("lastHw").value = st ? lastHomework(state.coach.id, st.id) : "";
    applyDurDefault();
  };

  const groupSel = $("groupSel");
  if (groupSel) groupSel.onchange = () => {
    state.groupSel = groupSel.value;
    const g = (state.coach.groups || []).find(x => x.id === groupSel.value);
    state.att = {};
    if (g) g.studentIds.forEach(id => { state.att[id] = true; });
    const k = durKey();
    if (k && durPrefs.get(k)) state.duration = durPrefs.get(k);
    render();
  };

  const attAll = $("attAll");
  if (attAll) {
    attAll.onchange = () => {
      state.coach.students.forEach(st => { state.att[st.id] = attAll.checked; });
      render();
    };
    document.querySelectorAll(".attBox").forEach(box => box.onchange = () => {
      state.att[box.dataset.sid] = box.checked;
      const all = state.coach.students.every(st => state.att[st.id]);
      $("attAll").checked = all;
    });
  }

  const recBtn = $("recBtn");
  // Android's speech engine duplicates finalized segments in continuous
  // mode (a known Chrome-on-Android quirk). Cure: on Android, run short
  // non-continuous sessions and let our auto-restart chain them - one
  // clean final result per session, no duplicates. Desktop/iOS keep
  // continuous mode.
  const IS_ANDROID = /Android/i.test(navigator.userAgent);
  const startListening = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR();
    rec.continuous = !IS_ANDROID; rec.interimResults = true; rec.lang = state.speechLang || "en-US";
    const base = $("transcript").value ? $("transcript").value.trim() + " " : "";
    rec.onresult = (ev) => {
      let fin = "", interim = "";
      for (let i = 0; i < ev.results.length; i++) {
        const r = ev.results[i];
        if (r.isFinal) fin += r[0].transcript + " ";
        else interim += r[0].transcript;
      }
      // Belt and braces: if this final segment already sits at the end of
      // the transcript (a session-boundary re-delivery), drop it.
      if (fin && base.trim().toLowerCase().endsWith(fin.trim().toLowerCase())) fin = "";
      state.finalText = base + fin + interim;
      $("transcript").value = state.finalText;
    };
    rec.onend = () => {
      state.finalText = $("transcript").value;
      if (state.recLive && !state.userStopped) { try { startListening(); return; } catch (e) { } }
      state.recLive = false;
      recBtn.classList.remove("live"); recBtn.textContent = "\ud83c\udf99 Tap to speak";
    };
    rec.onerror = (ev) => {
      if (ev.error === "no-speech" || ev.error === "aborted") return;
      state.userStopped = true;
      const langName = (SPEECH_LANGS.find(l => l[0] === state.speechLang) || ["", state.speechLang])[1];
      if (ev.error === "service-not-allowed" || ev.error === "language-not-supported") {
        $("genErr").textContent = "This phone's speech engine can't transcribe " + langName +
          " (or dictation is off in system settings). Options: switch Spoken Language to one your phone supports" +
          " - the report can still be written in " + state.reportLang + " - or type the memo." +
          " On iPhone: Settings > General > Keyboard > Enable Dictation, and add a " + langName + " keyboard.";
      } else if (ev.error === "not-allowed") {
        $("genErr").textContent = "Microphone permission denied - allow it in your browser settings, or type instead.";
      } else if (ev.error === "network") {
        $("genErr").textContent = "Speech recognition needs a connection for " + langName + " - check your network, or type instead.";
      } else {
        $("genErr").textContent = "Voice capture hiccup (" + ev.error + ") - your text is safe, tap to resume or type.";
      }
    };
    rec.start();
    state.rec = rec;
  };
  const startRecording = async () => {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = (window.MediaRecorder && MediaRecorder.isTypeSupported("audio/webm")) ? "audio/webm"
      : (window.MediaRecorder && MediaRecorder.isTypeSupported("audio/mp4")) ? "audio/mp4" : "";
    const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    const chunks = [];
    mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      recBtn.classList.remove("live");
      recBtn.disabled = true; recBtn.textContent = "Transcribing...";
      try {
        const blob = new Blob(chunks, { type: mr.mimeType || mime || "audio/webm" });
        const text = await transcribeCloud(blob);
        const base = $("transcript").value ? $("transcript").value.trim() + " " : "";
        state.finalText = (base + text.trim()).trim();
        $("transcript").value = state.finalText;
      } catch (err) {
        $("genErr").textContent = "Transcription failed: " + err.message + " You can type the memo, or try again.";
      }
      recBtn.disabled = false; recBtn.textContent = "\ud83c\udf99 Tap to speak";
      state.recLive = false; state.rec = null;
    };
    mr.start();
    state.rec = mr;
  };

  if (recBtn) recBtn.onclick = async () => {
    if (state.recLive) {
      state.userStopped = true;
      if (state.rec && state.rec.stop) state.rec.stop();
      return;
    }
    $("genErr").textContent = "";
    state.userStopped = false; state.recLive = true;
    recBtn.classList.add("live"); recBtn.textContent = "\u23f9 Recording - tap to stop";
    if (cloudSTT() && navigator.mediaDevices && window.MediaRecorder) {
      try { await startRecording(); return; }
      catch (e) {
        // fall through to the browser engine below
      }
    }
    try { recBtn.textContent = "\u23f9 Listening - tap to stop"; startListening(); }
    catch (e) { state.recLive = false; recBtn.classList.remove("live"); recBtn.textContent = "\ud83c\udf99 Tap to speak"; $("genErr").textContent = "Couldn't start the microphone - type instead."; }
  };

  $("genBtn").onclick = async () => {
    const transcript = $("transcript").value.trim();
    $("genErr").textContent = "";
    if (!transcript) { $("genErr").textContent = "Speak or type the voice memo first."; return; }
    if (state.recLive) { state.userStopped = true; state.rec.stop(); }
    state.date = $("date").value;
    state.duration = $("duration").value || "60";
    const dk = durKey();
    if (dk) durPrefs.set(dk, state.duration);

    if (state.lessonType === "private") {
      const st = state.coach.students.find(x => x.id === (studentSel ? studentSel.value : ""));
      if (!st) { $("genErr").textContent = "Choose a student first."; return; }
      $("genBtn").disabled = true; $("genBtn").textContent = "Writing the report...";
      try {
        const raw = await callClaude(reportPrompt({
          student: st, coach: state.coach, date: state.date,
          lessonType: "private", lastHw: $("lastHw").value.trim(), transcript,
        }));
        const f = parseFields(raw, ["REPORT", "HOMEWORK", "NOTES"]);
        state.draft = { student: st, date: state.date, lessonType: "private", transcript,
          report: f && f.REPORT ? f.REPORT : raw.trim(),
          homework: f ? f.HOMEWORK || "" : "",
          notes: f ? f.NOTES || "" : "Model didn't return the expected format - review the whole report carefully.",
          savedId: "" };
        notifyAdmin("report_generated", { student: st.name, date: state.date });
      } catch (err) {
        $("genErr").textContent = "Generation failed: " + err.message;
        $("genBtn").disabled = false; $("genBtn").textContent = "Generate report";
        return;
      }
      render();
      return;
    }

    const who = attendees();
    if (who.length === 0) { $("genErr").textContent = "Tick who was there first."; return; }

    if (state.lessonType === "group") {
      $("genBtn").disabled = true; $("genBtn").textContent = "Sorting the group notes...";
      try {
        const raw = await callClaude(groupNotesPrompt({ students: who, coach: state.coach, date: state.date, transcript }));
        const keys = ["COMMON", "HOMEWORK"].concat(who.map(st => "STUDENT:" + st.id)).concat(["NOTES"]);
        const f = parseFields(raw, keys);
        if (!f || !("COMMON" in f)) throw new Error("model didn't return the expected format - try again.");
        const notes = {};
        who.forEach(st => {
          const t = (f["STUDENT:" + st.id] || "").trim();
          notes[st.id] = /^NOT MENTIONED$/i.test(t) ? "" : t;
        });
        state.gdraft = { stage: "notes", transcript, order: who.map(st => st.id),
          common: (f.COMMON || "").trim(), homework: (f.HOMEWORK || "").trim(),
          notes, flags: (f.NOTES || "").trim(), reports: {} };
        notifyAdmin("group_notes_generated", { date: state.date, count: who.length });
      } catch (err) {
        $("genErr").textContent = "Couldn't sort the notes: " + err.message;
        $("genBtn").disabled = false; $("genBtn").textContent = "Extract group notes";
        return;
      }
      render();
      return;
    }

    // clinic
    $("genBtn").disabled = true; $("genBtn").textContent = "Writing the clinic report...";
    try {
      const raw = await callClaude(clinicPrompt({ coach: state.coach, date: state.date, count: who.length, transcript }));
      const f = parseFields(raw, ["REPORT", "HOMEWORK", "NOTES"]);
      state.cdraft = { transcript, attendees: who.map(st => st.id),
        report: f && f.REPORT ? f.REPORT : raw.trim(),
        homework: f ? f.HOMEWORK || "" : "",
        notes: f ? f.NOTES || "" : "Model didn't return the expected format - review carefully." };
      notifyAdmin("clinic_report_generated", { date: state.date, count: who.length });
    } catch (err) {
      $("genErr").textContent = "Generation failed: " + err.message;
      $("genBtn").disabled = false; $("genBtn").textContent = "Generate clinic report";
      return;
    }
    render();
  };

  bindPrivateDraft();
  bindGroupDraft();
  bindClinicDraft();
}

// ---- Cloud transcription (Whisper via the admin's Apps Script) ----
// Records real audio and sends it to the webhook, which holds the Whisper
// key server-side. Identical behavior on every phone, every language.
function cloudSTT() { return !!(state.coach && state.coach.adminWebhook); }

async function transcribeCloud(blob) {
  const hook = state.coach.adminWebhook;
  const b64 = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1]);
    r.onerror = () => rej(new Error("couldn't read the recording"));
    r.readAsDataURL(blob);
  });
  const res = await fetch(hook, { method: "POST", redirect: "follow",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ action: "transcribe", audioBase64: b64,
      mime: blob.type || "audio/webm", lang: (state.speechLang || "en-US").split("-")[0],
      at: new Date().toISOString(), coach: state.coach.name }) });
  const t = await res.text();
  let j;
  try { j = JSON.parse(t); }
  catch (e) { throw new Error("the webhook returned an unexpected response - is the latest Apps Script version deployed?"); }
  if (j.error) throw new Error(j.error);
  return j.text || "";
}

function saveEntryFor(student, fields) {
  const data = store.load();
  const entry = Object.assign({
    id: "e" + Date.now() + Math.random().toString(36).slice(2, 6),
    coachId: state.coach.id, studentId: student.id,
    createdAt: new Date().toISOString(),
  }, fields);
  data.entries.push(entry); store.save(data);
  notifyAdmin("report_saved", { student: student.name, date: fields.date });
  return entry.id;
}

function bindPrivateDraft() {
  const d = state.draft;
  if (!d || state.lessonType !== "private") return;
  $("reportText").oninput = () => { d.report = $("reportText").value; };
  $("hwOut").oninput = () => { d.homework = $("hwOut").value; };
  const saveDraft = () => {
    if (d.savedId) return d.savedId;
    d.savedId = saveEntryFor(d.student, { date: d.date, lessonType: "private", duration: state.duration,
      transcript: d.transcript, report: d.report, homework: d.homework.trim() });
    $("doneMsg").style.display = "block";
    $("doneMsg").textContent = "Saved. Entry No. " + entryNoOf(d.student.id, d.savedId) + " in " + d.student.name + "'s record.";
    $("saveBtn").textContent = "Saved to record";
    return d.savedId;
  };
  $("saveBtn").onclick = saveDraft;
  $("sendBtn").onclick = () => {
    const id = saveDraft();
    sendReportToParents({ student: d.student, date: d.date, lessonType: "private",
      report: d.report, entryNo: entryNoOf(d.student.id, id) });
  };
  $("pdfBtn").onclick = () => {
    try {
      const r = makeLessonPdf({ student: d.student, coach: state.coach, date: d.date, duration: state.duration,
        lessonType: "private", reportMd: d.report,
        entryNo: d.savedId ? entryNoOf(d.student.id, d.savedId) : entryNoOf(d.student.id, "future") });
      downloadPdfBytes(r.pdf, r.filename);
      notifyAdmin("pdf_downloaded", { student: d.student.name, date: d.date });
    } catch (e) { $("doneMsg").style.display = "block"; $("doneMsg").textContent = "PDF failed - copy the text instead."; }
  };
  $("emailBtn").onclick = () => emailEntry({ report: d.report, date: d.date }, d.student);
}

function bindGroupDraft() {
  const g = state.gdraft;
  if (!g || state.lessonType !== "group") return;
  const backBtn = $("gBackBtn");
  if (backBtn) backBtn.onclick = () => {
    if (g.stage === "reports") { g.stage = "notes"; } else { state.gdraft = null; }
    render();
  };
  if (g.stage === "notes") {
    $("gCommon").oninput = () => { g.common = $("gCommon").value; };
    $("gHw").oninput = () => { g.homework = $("gHw").value; };
    document.querySelectorAll(".gNote").forEach(t => t.oninput = () => { g.notes[t.dataset.sid] = t.value; });
    $("gGenBtn").onclick = async () => {
      $("gErr").textContent = "";
      $("gGenBtn").disabled = true;
      g.reports = {};
      let i = 0;
      for (const sid of g.order) {
        i++;
        const st = state.coach.students.find(x => x.id === sid);
        $("gGenBtn").textContent = "Writing " + i + " of " + g.order.length + " (" + st.name + ")...";
        try {
          const raw = await callClaude(groupReportPrompt({ student: st, coach: state.coach,
            date: state.date, common: g.common, note: g.notes[sid] || "", homework: g.homework }));
          const f = parseFields(raw, ["REPORT", "HOMEWORK"]);
          g.reports[sid] = { report: f && f.REPORT ? f.REPORT : raw.trim(),
            homework: (f && f.HOMEWORK ? f.HOMEWORK : g.homework || "").trim(), sent: false, savedId: "" };
        } catch (err) {
          $("gErr").textContent = "Failed on " + st.name + ": " + err.message + " - fix and try again.";
          $("gGenBtn").disabled = false;
          $("gGenBtn").textContent = "Confirm notes \u2192 write " + g.order.length + " report(s)";
          return;
        }
      }
      g.stage = "reports";
      notifyAdmin("group_reports_generated", { date: state.date, count: g.order.length });
      render();
    };
    return;
  }
  // stage === "reports"
  document.querySelectorAll(".gReport").forEach(t => t.oninput = () => { g.reports[t.dataset.sid].report = t.value; });
  document.querySelectorAll(".gRepHw").forEach(t => t.oninput = () => { g.reports[t.dataset.sid].homework = t.value; });
  const sendOne = (sid) => {
    const st = state.coach.students.find(x => x.id === sid);
    const r = g.reports[sid];
    if (!r.savedId) r.savedId = saveEntryFor(st, { date: state.date, lessonType: "group", duration: state.duration,
      transcript: g.transcript, report: r.report, homework: r.homework.trim() });
    sendReportToParents({ student: st, date: state.date, lessonType: "group",
      report: r.report, entryNo: entryNoOf(st.id, r.savedId) });
    r.sent = true;
  };
  document.querySelectorAll("[data-gsend]").forEach(b => b.onclick = () => { sendOne(b.dataset.gsend); render(); });
  document.querySelectorAll("[data-gpdf]").forEach(b => b.onclick = () => {
    const st = state.coach.students.find(x => x.id === b.dataset.gpdf);
    const r = g.reports[b.dataset.gpdf];
    const no = r.savedId ? entryNoOf(st.id, r.savedId) : entryNoOf(st.id, "future");
    const out = makeLessonPdf({ student: st, coach: state.coach, date: state.date, duration: state.duration,
      lessonType: "group", reportMd: r.report, entryNo: no });
    downloadPdfBytes(out.pdf, out.filename);
    notifyAdmin("pdf_downloaded", { student: st.name, date: state.date });
  });
  const sendAll = $("gSendAll");
  if (sendAll) sendAll.onclick = () => {
    g.order.forEach(sid => sendOne(sid));
    render();
    const done = $("gDone");
    if (done) { done.style.display = "block"; done.textContent = "All " + g.order.length + " sent and saved to each child's record."; }
  };
}

function bindClinicDraft() {
  const cd = state.cdraft;
  if (!cd || state.lessonType !== "clinic") return;
  $("cReport").oninput = () => { cd.report = $("cReport").value; };
  $("cHw").oninput = () => { cd.homework = $("cHw").value; };
  const fullReport = () => cd.report + (cd.homework.trim() && cd.report.indexOf("practice at home") < 0
    ? "\n\n**To practice at home:** " + cd.homework.trim() : "");
  $("cSendAll").onclick = () => {
    let n = 0;
    cd.attendees.forEach(sid => {
      const st = state.coach.students.find(x => x.id === sid);
      if (!st) return;
      const id = saveEntryFor(st, { date: state.date, lessonType: "clinic", duration: state.duration,
        transcript: cd.transcript, report: fullReport(), homework: "" });
      sendReportToParents({ student: st, date: state.date, lessonType: "clinic",
        report: fullReport(), entryNo: entryNoOf(st.id, id) });
      n++;
    });
    const done = $("cDone");
    done.style.display = "block";
    done.textContent = "Sent to " + n + " families and saved to each child's record.";
  };
  $("cPdf").onclick = () => {
    const st = state.coach.students.find(x => x.id === cd.attendees[0]);
    const out = makeLessonPdf({ student: st, coach: state.coach, date: state.date, duration: state.duration,
      lessonType: "clinic", reportMd: fullReport(), entryNo: entryNoOf(st.id, "future") });
    downloadPdfBytes(out.pdf, out.filename);
  };
}

function bindRecord() {
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => {
    state.openEntryId = state.openEntryId === b.dataset.open ? "" : b.dataset.open;
    render();
  });
  document.querySelectorAll("[data-pdf]").forEach(b => b.onclick = () => {
    const e = store.load().entries.find(x => x.id === b.dataset.pdf);
    const s = state.coach.students.find(x => x.id === e.studentId);
    const r = makeLessonPdf({ student: s, coach: state.coach, date: e.date, lessonType: e.lessonType,
      duration: e.duration || "", reportMd: e.report, entryNo: entryNoOf(e.studentId, e.id) });
    downloadPdfBytes(r.pdf, r.filename);
    notifyAdmin("pdf_downloaded", { student: s.name, date: e.date });
  });
  document.querySelectorAll("[data-send]").forEach(b => b.onclick = () => {
    const e = store.load().entries.find(x => x.id === b.dataset.send);
    const s = state.coach.students.find(x => x.id === e.studentId);
    sendReportToParents({ student: s, date: e.date, lessonType: e.lessonType,
      report: e.report, entryNo: entryNoOf(e.studentId, e.id) });
  });
  document.querySelectorAll("[data-mail]").forEach(b => b.onclick = () => {
    const e = store.load().entries.find(x => x.id === b.dataset.mail);
    const s = state.coach.students.find(x => x.id === e.studentId);
    emailEntry(e, s);
  });
}

function bindSettings() {
  const tl = $("testLog");
  if (tl) tl.onclick = () => {
    notifyAdmin("webhook_test_app", {});
    toast("Test fired - a row should land in the admin sheet within seconds. No row = the webhook in this login is missing or wrong.");
  };
  $("saveKey").onclick = () => {
    settings.apiKey = $("apiKey").value.trim();
    $("setOk").style.display = "block"; $("setOk").textContent = "Key saved on this device.";
  };
  $("testKey").onclick = async () => {
    settings.apiKey = $("apiKey").value.trim();
    $("setErr").textContent = ""; $("setOk").style.display = "none";
    try {
      await callClaude("Reply with the single word: ok");
      $("setOk").style.display = "block"; $("setOk").textContent = "Key works. You're set.";
    } catch (err) { $("setErr").textContent = "Test failed: " + err.message; }
  };
}
